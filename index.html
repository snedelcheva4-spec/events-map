<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Blue Book Events Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style id="pageStyle">/* Layout: full-bleed pannable map; floating top bar with filter chips; bottom tab bar; bottom sheets for event cards, ideas, lineup and vote. */
:root{
  --bg:#f4f6f3; --land:#eef1ec; --road:#ffffff; --road-casing:#d4d9df; --art:#fff1c2; --art-casing:#e4cc88; --water:#a9d5ee; --park:#cfe8c6; --rail:#7b8794;
  --ink:#14213d; --muted:#56657d; --surface:#ffffff; --surface-2:#f1f4f8; --line:rgba(20,33,61,.12);
  --shadow:0 8px 28px rgba(20,33,61,.18); --accent:#ff5c93; --on-cat:#10192b;
  --c-party:#ff5c93; --c-meet:#ffc233; --c-explore:#2fd0c0; --c-chill:#a08cff; --c-green:#78d664;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.app{position:relative;height:100%;overflow:hidden}

/* map */
.stage{position:absolute;inset:0;touch-action:none;cursor:grab;background:var(--land);overflow:hidden}
.stage.dragging{cursor:grabbing}
.stage svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}

/* animated bubble icons */
.ico *{transform-box:fill-box}
.zoomed .zone .area,.zone:hover .area,.zone.sel .area{opacity:1}
.zone:not(:hover):not(.sel) .ico [class^="a-"]{animation:none}
.a-bob{animation:bob 2.4s ease-in-out infinite}
.a-sway{transform-origin:50% 0;animation:sway 2.6s ease-in-out infinite}
.a-steam{animation:steam 2.2s ease-in-out infinite}
.a-steam2{animation:steam 2.2s ease-in-out .7s infinite}
.a-ball{animation:ballarc 1.8s cubic-bezier(.45,.05,.55,.95) infinite}
.a-spin{transform-origin:center;animation:spin 7s linear infinite}
.a-wave{transform-origin:0 50%;animation:wave 1.6s ease-in-out infinite}
.a-wave2{transform-origin:0 50%;animation:wave 1.6s ease-in-out .5s infinite}
.a-shackle{animation:shackle 2.8s ease-in-out infinite}
.a-twinkle{transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
.a-twinkle2{transform-origin:center;animation:twinkle 1.6s ease-in-out .8s infinite}
.a-blink{animation:blink 2s ease-in-out infinite}
.a-blink2{animation:blink 2s ease-in-out 1s infinite}
.a-kick{transform-origin:center;animation:kick 2.2s ease-in-out infinite}
.a-ride{animation:ride 2.4s ease-in-out infinite}
.a-slide2{animation:slide2 1.4s linear infinite}
@keyframes slide2{from{transform:translateX(-6px)}to{transform:translateX(0)}}
.a-bounce{transform-origin:50% 100%;animation:bounce 1.1s infinite}
.a-spin2{transform-origin:center;animation:spin 1.1s linear infinite}
.a-shadow{transform-origin:center;animation:shadow 1.1s infinite}
@keyframes bounce{
  0%{transform:translateY(5px) scale(1.18,.82);animation-timing-function:cubic-bezier(.2,.8,.4,1)}
  50%{transform:translateY(-8px) scale(1,1);animation-timing-function:cubic-bezier(.6,0,.8,.3)}
  100%{transform:translateY(5px) scale(1.18,.82)}}
@keyframes shadow{0%,100%{transform:scale(1.1);opacity:.32}50%{transform:scale(.5);opacity:.12}}
.a-slide{animation:slide 6s linear infinite}
@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(11px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes sway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes steam{0%{transform:translateY(2px);opacity:0}40%{opacity:.9}100%{transform:translateY(-5px);opacity:0}}
@keyframes ballarc{0%{transform:translate(-9px,3px)}50%{transform:translate(0,-9px)}100%{transform:translate(9px,3px)}}
@keyframes wave{0%,100%{transform:skewY(-8deg)}50%{transform:skewY(8deg)}}
@keyframes shackle{0%,45%,100%{transform:translateY(0)}60%,85%{transform:translateY(-3.4px)}}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.15);opacity:1}}
@keyframes blink{0%,45%,100%{opacity:.25}20%{opacity:1}}
@keyframes kick{0%{transform:translate(-4px,2px) rotate(0)}50%{transform:translate(2px,-7px) rotate(180deg)}100%{transform:translate(-4px,2px) rotate(360deg)}}
@keyframes ride{0%,100%{transform:translateX(-1.8px)}50%{transform:translateX(1.8px)}}
.zone{cursor:pointer;transition:opacity .25s}
.zone.dim{opacity:.16;pointer-events:none}
.zone .bub{fill:var(--surface);stroke-width:3;transform-box:fill-box;transform-origin:center;transition:transform .2s}
.zone:hover .bub,.zone.sel .bub{transform:scale(1.14)}
.zone .ico{pointer-events:none}
.zone .name{font-family:var(--f-display);font-weight:700;font-size:12px;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.zone .area{opacity:0;transition:opacity .2s;font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-anchor:middle;fill:var(--muted);paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.zone .tick{opacity:0;transition:opacity .2s;transform-box:fill-box;transform-origin:center}
.zone.joined .tick{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{background:var(--surface);border-radius:18px;padding:8px 14px;box-shadow:var(--shadow);min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.1;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.votepill{background:var(--accent);color:var(--on-cat);font-weight:700;border-radius:999px;padding:11px 16px;box-shadow:var(--shadow);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px;box-shadow:0 2px 10px rgba(20,33,61,.14);transition:background .2s}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink));display:block}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));color:var(--on-cat)}
.chip[aria-pressed="true"] i{background:var(--on-cat)}
.chip[data-cat="all"]{--c:var(--ink)}
.chip[data-cat="all"][aria-pressed="true"]{color:var(--bg)}
.chip[data-cat="all"][aria-pressed="true"] i{background:var(--bg)}

/* floating map controls */
.fly{position:absolute;left:16px;bottom:96px;background:var(--surface);border-radius:999px;padding:10px 15px;font-weight:700;font-size:14px;box-shadow:var(--shadow);z-index:4;display:flex;gap:8px;align-items:center}
.zoom{position:absolute;right:16px;bottom:96px;display:flex;flex-direction:column;gap:8px;z-index:4}
.zoom button{width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:22px;font-weight:700;line-height:1}
.hint{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;z-index:3;white-space:nowrap;transition:opacity .6s;pointer-events:none}
.hint.gone{opacity:0}

/* tab bar */
.tabs{position:absolute;left:16px;right:16px;bottom:16px;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:6px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50px;gap:1px;padding:7px 4px;border-radius:16px;font-weight:700;font-size:12px;color:var(--muted)}
.tab b{font-family:var(--f-display);font-size:17px;color:var(--ink);line-height:1.1}
.tab[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}

/* raw ideas side panel */
.side{position:absolute;right:0;top:132px;bottom:96px;width:min(310px,84%);z-index:6;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 0 0 22px;box-shadow:var(--shadow);transform:translateX(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.9,.3,1),visibility 0s .3s}
.side.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.sidehead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:14px 12px 8px 16px;flex:none}
.sidehead h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1}
.sidehead p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.sidelist{overflow-y:auto;padding:4px 12px calc(14px + env(safe-area-inset-bottom,0px)) 12px;min-height:0}
.sidelist .irow{padding:8px 8px 8px 12px}
.sidelist .irow strong{font-size:14.5px}
.sidelist .irow span{font-size:12.5px}
.sidelist .plus{width:38px;height:38px}
.sidetab{position:absolute;right:0;top:230px;z-index:5;writing-mode:vertical-rl;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;letter-spacing:.06em;padding:14px 9px;border-radius:14px 0 0 14px;box-shadow:var(--shadow);animation:nudge 3s ease-in-out 1.5s 1}
.sidetab[aria-expanded="true"]{display:none}
@keyframes nudge{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(0)}}
.app.side-open .zoom{opacity:0;pointer-events:none}
@media (min-width:700px){
  .side{width:330px}
  .app.side-open .zoom{opacity:1;pointer-events:auto;right:360px}
}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(8,14,26,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:7}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;max-height:84%;display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(8,14,26,.3);transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.3,1),visibility 0s .32s}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 4px;flex:none}
.sbody{overflow-y:auto;padding:6px 16px calc(20px + env(safe-area-inset-bottom,0px));min-width:0}
.sbody h2{margin:6px 0 2px;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.015em;text-wrap:balance}
.sub{margin:0 0 14px;color:var(--muted)}
.catpill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.catpill i{width:12px;height:12px;border-radius:50%;background:var(--c);display:block}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);font-size:18px;line-height:1}
.tag{font-size:17px;font-weight:500;margin:4px 0 10px}
.facts{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}
.facts li{display:flex;gap:10px;align-items:flex-start;min-width:0}
.facts li::before{content:"";flex:none;width:8px;height:8px;margin-top:7px;border-radius:50%;background:var(--c)}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.kws span{font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;background:var(--surface-2);border:1.5px solid var(--c)}
.meta{display:grid;gap:10px;margin:12px 0 14px}
.meta div{background:var(--surface-2);border-radius:14px;padding:10px 12px;min-width:0}
.meta small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{display:flex;align-items:center;gap:12px}
.hero svg{flex:none;width:64px;height:64px;background:var(--surface-2);border-radius:20px;border:3px solid var(--c)}
.hero h2{margin:0}
.actions{display:flex;gap:10px;align-items:center}
.join{position:relative;flex:1;background:var(--c);color:var(--on-cat);font-weight:700;font-size:17px;border-radius:16px;padding:14px 16px;transition:transform .15s}
.join:active{transform:scale(.97)}
.join[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.nav{width:48px;height:48px;border-radius:50%;background:var(--surface-2);font-size:20px;font-weight:700}
.count{margin:10px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.conf{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:2px;pointer-events:none;animation:conf .9s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* idea + lineup rows */
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.irow{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:16px;padding:10px 10px 10px 14px;min-width:0}
.irow i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.irow div{flex:1;min-width:0}
.irow strong{display:block;font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.2}
.irow span{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.plus{flex:none;width:42px;height:42px;border-radius:50%;background:var(--surface);border:2px solid var(--c);font-size:20px;font-weight:700;line-height:1}
.plus[aria-pressed="true"]{background:var(--c);color:var(--on-cat)}
.cta{display:block;text-align:center;background:var(--accent);color:var(--on-cat);font-weight:700;font-size:18px;border-radius:18px;padding:16px;text-decoration:none;margin-top:16px}
.cta[aria-disabled="true"]{background:var(--surface-2);color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;text-align:center}
.empty{background:var(--surface-2);border-radius:16px;padding:16px;color:var(--muted)}
@media (min-width:700px){
  .sheet{left:50%;right:auto;width:520px;transform:translate(-50%,105%)}
  .sheet.open{transform:translate(-50%,0)}
  .tabs{left:50%;right:auto;width:420px;transform:translateX(-50%)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ===== v4 overrides: calmer bubbles, light map, new sections ===== */
:root{
  --land:#f6f5f4; --bg:#f6f5f4;
  --c-sport:#4f9dff;
}
.stage{background:#f6f5f4}
/* bubbles: small, flat, quiet. Icons only move on the bubble you touch. */
.zone .bub{fill:#fff;stroke-width:3;transition:transform .18s}
.zone:hover .bub,.zone.sel .bub{transform:scale(1.12)}
.zone .shadow{fill:#14213d;opacity:.16}
.zone .name{font-family:var(--f-body);font-weight:700;font-size:10px;letter-spacing:.01em;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.zone:not(.sel):not(:hover) .ico [class*="a-"]{animation:none}
.zone .ico [class*="a-"]{will-change:transform}
.zone .tick circle{stroke:#fff}
.maplabel{font-family:var(--f-body);font-size:10px;font-weight:700;fill:#5b6778;text-anchor:middle;paint-order:stroke;stroke:#f6f5f4;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.maplabel.big{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:.2em;fill:#14213d;opacity:.1;stroke:none}
.hint{max-width:min(250px,calc(100% - 32px));white-space:normal;text-align:center;font-size:12px;padding:7px 12px;bottom:140px}

/* tabs */
.tab{font-size:12px;line-height:1.15;text-align:center}
.tab b{font-size:15px}

/* sheets that hold long text */
.sheet{max-height:88%}
.vhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.vhead h2{margin:10px 0 0;flex:1;min-width:0}
.avatar{flex:none;width:100px;height:107px;margin:-2px 0 4px 0}
.avatar svg{width:100%;height:100%;display:block;overflow:visible}
.wavehand{transform-box:view-box;transform-origin:118px 90px;animation:waving 1.5s ease-in-out infinite}
@keyframes waving{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
.vote p{margin:0 0 10px}
.vote strong{font-weight:800}
.vote h3{margin:16px 0 10px;font-family:var(--f-display);font-weight:800;font-size:19px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--surface-2);border-radius:16px;padding:12px 14px 12px 12px;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-cat);font-family:var(--f-display);font-weight:800;font-size:17px}
.steps b{display:block;font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.25;margin-bottom:2px}
.steps span{display:block;color:var(--muted);font-size:14.5px;line-height:1.4}
.steps div{min-width:0}

/* owner editing (opens with #edit on the link) */
.editfab{position:absolute;left:16px;bottom:150px;z-index:5;background:var(--ink);color:#fff;font-weight:700;font-size:14px;border-radius:999px;padding:11px 16px;box-shadow:var(--shadow)}
.ed h2{margin-bottom:4px}
.ed fieldset{border:0;margin:14px 0 0;padding:0;min-width:0}
.ed legend{font-family:var(--f-display);font-weight:800;font-size:18px;padding:0;margin:0 0 6px}
.ed label{display:block;margin:8px 0 0;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ed input,.ed textarea,.ed select{display:block;width:100%;margin-top:4px;font:inherit;font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px}
.ed textarea{min-height:84px;resize:vertical}
.ed details{background:var(--surface-2);border-radius:14px;padding:4px 12px;margin:8px 0}
.ed summary{cursor:pointer;font-weight:700;padding:8px 0}
.ed .rowcard{background:var(--surface-2);border-radius:14px;padding:4px 12px 12px;margin:8px 0}
.ed .mini{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:7px 13px}
.ed .save{display:block;width:100%;margin-top:18px;background:var(--accent);color:var(--on-cat);font-weight:800;font-size:17px;border-radius:16px;padding:15px}
.ed .save[disabled]{opacity:.6}
.ed .status{margin:10px 0 0;font-size:14px;min-height:20px}
.ed .help{font-size:13px;color:var(--muted);margin:2px 0 0}
#mount{height:100%}

.steps li:nth-child(1)::before{background:var(--c-party)}
.steps li:nth-child(2)::before{background:var(--c-explore)}
.steps li:nth-child(3)::before{background:var(--c-chill)}
.steps li:nth-child(4)::before{background:var(--c-meet)}
.steps li:nth-child(5)::before{background:var(--c-green)}
.steps li:nth-child(6)::before{background:var(--c-sport)}
.catw{font-style:normal;font-weight:800;color:color-mix(in srgb,var(--c) 78%,#000)}
.ctaline{margin:0!important;padding:44px 0 14px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.25;color:var(--ink)}

.maplabel.city{font-family:var(--f-display);font-size:17px;font-weight:800;letter-spacing:.28em;fill:#3a4a63;opacity:.55;stroke:#f6f5f4;stroke-width:4px}

<script type="application/json" id="siteData">{"formUrl":"","title":"Upcoming Events","subtitle":"to be excited for","cats":{"meet":"Social","explore":"Explore","party":"Party","sport":"Sports","chill":"Arts & crafts","green":"Green"},"vote":{"pill":"Why vote for me","title":"Why vote for me","intro":["Hi! My name is Simona and here are the reasons why voting for me would benefit **you**.","The events you see on the map and in the side menu are just a few ideas I’ve put together to get us started! We are nearly 900 trainees in Brussels, all bringing their own interests, cultures and ideas to the table, so the possibilities for amazing events are practically endless - and I’d love to get this going for all of us!","And that’s where I come in: helping turn cool ideas into actual events that we can all enjoy together!","As a former Erasmus Student Network volunteer, I’ve already had the chance to organise events for 200+ international students, so I know what goes into bringing people from different cultures together and making sure everyone has a good time. I’d love to bring that experience to the Blue Book community!💙"],"proposeTitle":"What I propose","points":[{"lead":"A balanced number of events in each category","text":"Meet people, explore Belgium, party hard, do sports, practice arts and crafts, participate in green events - my goal is that each of you has their “That’s the event for me!” on a regular basis!"},{"lead":"Events Wishlist","text":"Do you have an event idea you would like to see becoming a reality? You will be able to propose it! Leave the organisation to me and the Events committee!"},{"lead":"No more FOMO","text":"You feel like there's so much going on and you can't keep up? I suggest a user-friendly visual bi-monthly calendar that combines everything that's going on in one place so you never miss something again!"}],"cta":"Your vote is on the right place with me! 😉"},"events":{"ghent":{"name":"Ghent day trip","short":"Ghent trip","tag":"Out in the morning, back by the evening.","text":"An adventurous tresure hunt that helps you explore one of the most vibrant cities in Belgium - **Ghent**. We leave Brussels in the morning and come back in the evening.","kw":["weekend day trip","old town","Christmas market","treasure hunt"],"goal":"Share a unique experience of exploring the old city Ghent in a fun and interactive way.","best":"Explorers and anyone who needs a day off from the office.","when":""},"quiz":{"name":"International quiz","short":"Quiz night","tag":"Think you know it all? Time to put it to the test!","text":"Surrounded by masterminds - time to combine all our brainpower and fight for the final prize! Who knows the most?","kw":["teams","trivia","prizes","crazy questions"],"goal":"Mix nationalities and DGs at the same table.","best":"Everyone. No skills needed, only team spirit.","when":""},"xmas":{"name":"Christmas markets crawl","short":"Christmas markets","tag":"Hot mugs, fairy lights, mood nice enough to warm us up!","text":"An evening stroll through the Christmas markets in the centre of Brussels, stall by stall, with a glühwein or another hot drink in hand. Let's dive into the winter mood!","kw":["Christmas tree","fairy lights","glühwein","winter"],"goal":"Bring trainees together for one cosy winter evening.","best":"Everyone who likes the Christmas spirit and warm mugs.","when":""},"thrift":{"name":"Thrift hopping","short":"Thrift hopping","tag":"Second-hand shops, first-class finds.","text":"Let's go from one second-hand shop to the next one! Time to find some hidden gems, give the best fashiion advice to your peers and be sustainable!","kw":["second-hand","vintage","sustainable","fashion"],"goal":"Shop green and get to know each other on the way.","best":"Bargain hunters, fashion fans and sustainability lovers.","when":""},"speed":{"name":"Speed friending","short":"Speed friending","tag":"Chop chop - no time to waste, let's make some unexpected friends!","text":"Forget “So, what do you do?” We’re going straight to the deep stuff. Short one-to-one conversations, a new face every round, and just enough time to find out if your energies match. ","kw":["short rounds","conversation cards","new faces"],"goal":"Make real friends fast, without awkward small talk.","best":"Newcomers, shy people and everyone who wants a bigger circle.","when":""},"pong":{"name":"Beer pong tournament","short":"Beer pong","tag":"Aim carefully. Or don’t.","text":"Think your aim is unbeatable? Grab a teammate, choose your team name, and prove it in a knockout battle for the trophy! Expect loud cheers, friendly rivalries, and a water version for those who prefer it!","kw":["BEER","tournament","teams","trophies","water pong too"],"goal":"Make new friends, compete for glory, get (responsibly) drunk","best":"Competitive types, party people, beer lovers","when":""},"flag":{"name":"Flag party","short":"Flag party","tag":"Wear your colours. Bring your flag.","text":"Dress in the colours of your country, bring a flag and show everyone how hard your nation can party! It's a representation mission now!","kw":["countries","flags","music","photo wall"],"goal":"United in diversityyyy (EU likes this)","best":"Everyone, from every country.","when":""},"escape":{"name":"Escape room","short":"Escape room","tag":"Locked in with your colleagues. Friendly ones.","text":"Small teams, one room, sixty minutes. You cannot win it alone, which is exactly the point. Which team will figure it out first?","kw":["teamwork","puzzles","mixed teams","friendships","logic"],"goal":"Build quick bonds by solving something together.","best":"Logical challenges fans and team players.","when":""},"talent":{"name":"Trainee talent show","short":"Talent show","tag":"ECTA’s got talent. Some of it is still hidden.","text":"Sing, dance, juggle, do stand-up or play an instrument. The audience cheers, votes and supports loudly! No talent needed to sit in the crowd.","kw":["open stage","singing","dancing","crazy picks"],"goal":"Show a different side of yourself and cheer on everyone's talents","best":"Performers and professional audience members.","when":""},"football":{"name":"Champions League night","short":"Football night","tag":"Big screen, big match, questionable opinions.","text":"We watch Barcelona against Manchester City together on a big screen, with snacks and loud commentary. Fans of either team are welcome, and so are neutrals who just like the atmosphere.","kw":["football","big screen","Champions League","snacks"],"goal":"Watch football togehter and support the best team!","best":"Football fans, and anyone who enjoys a loud, friendly crowd.","when":"Tuesday 8 December 2026, 21:00"},"brewery":{"name":"Beer brewery visit","short":"Brewery visit","tag":"See how it’s made, then taste it.","text":"A trip to an authentic beer brewery in Brussels to see how Belgian beer is made, followed by a beer tasting. ","kw":["brewery","tasting","Belgian beer","craft"],"goal":"Learn something about Belgian beer culture over a drink with new people.","best":"Beer lovers and the curious.","when":""},"museums":{"name":"Museums challenge","short":"Museums challenge","tag":"Museum hopping with a scoreboard.","text":"We visit a few Brussels museums in one go and complete small challenges along the way: spot a detail, strike the pose, answer a clue. Teams collect points and the best team wins.","kw":["museums","challenges","teams","culture"],"goal":"Discover Brussels’ museums in a playful way.","best":"Curious people and culture lovers. No art knowledge needed.","when":""},"olympics":{"name":"Trainee Olympics","short":"Trainee Olympics","tag":"Gold medals for the best ones!","text":"Mixed teams compete in the best of famous sports. Pick your team wisely - you will need a representative in every sport. ;)","kw":["teams","sports","medals"],"goal":"Get people moving together and sharing the joy of sports","best":"Everyone who likes a bit of friendly competition, from couch potatoes to marathon runners.","when":""},"pottery":{"name":"Pottery making","short":"Pottery","tag":"Get your hands dirty, in a good way.","text":"A relaxed workshop where everyone shapes a bowl, a mug or something they will insist is a vase. Chat while you create, and take your piece home.","kw":["workshop","clay","creative","take-home"],"goal":"Slow down, make something beautiful and talk without pressure.","best":"Anyone who wants a calm evening. No arts skills needed.","when":""}},"ideas":[{"id":"i-board","cat":"meet","name":"Board games night","line":"Classics, party games and one very long strategy game."},{"id":"i-dance","cat":"party","name":"Traditional dances night","line":"Show a dance from your country and teach the others in the room."},{"id":"i-swap","cat":"sport","name":"Bike day","line":"Hop on a bike and discover the city beyond the usual tourist spots!"},{"id":"i-skate","cat":"explore","name":"Bruges trip","line":"Spend a weekend in the medieval city of Bruges - lots of activities planned!"},{"id":"i-cinema","cat":"chill","name":"Paint and Wine","line":"Recreate a beautiful painting while enjoying a glass of wine and a good company."},{"id":"i-potluck","cat":"meet","name":"International dinner vol.2","line":"Everyone brings a dish from their homecountry, no one is left hungry."},{"id":"i-karaoke","cat":"party","name":"Karaoke night","line":"Sing badly together. Nobody remembers on Monday."},{"id":"i-plant","cat":"green","name":"Sewing and repair café","line":"Bring your favourite piece of clothing and learn how to fix it"},{"id":"i-lang","cat":"meet","name":"Language café","line":"Practise a language over a coffee, no grammar police."},{"id":"i-santa","cat":"meet","name":"Secret Santa","line":"A small gift, a big laugh, a budget everyone sticks to."},{"id":"i-clean","cat":"green","name":"Forest clean-up walk","line":"A walk with gloves and a bag, then hot chocolate."},{"id":"i-bowling","cat":"sport","name":"Bowling night","line":"Strikes, wobbly balls and a lot of laughter."},{"id":"i-cook","cat":"chill","name":"Cooking class","line":"Cook one proper dish as a team, then eat it."},{"id":"i-date","cat":"party","name":"Speed dating, spicy edition","line":"For the brave. Friendly, optional and straight to the point."},{"id":"i-zero","cat":"green","name":"Zero-waste swap","line":"Bring old items you would exchange for something different."},{"id":"i-padel","cat":"sport","name":"Padel or badminton day","line":"Get these balls goiiing"},{"id":"i-roulette","cat":"meet","name":"Coffee roulette","line":"Get matched with a random trainee for a 30-minute coffee."},{"id":"i-yoga","cat":"sport","name":"Yoga and stretch session","line":"A calm hour to undo the desk posture."},{"id":"i-buddy","cat":"sport","name":"Chess tournament","line":"Play a game of chess with the other trainees."},{"id":"i-mv46g8s7","cat":"party","name":"Dress as your DG party","line":"And suddenly everyone's got very creative!"},{"id":"i-mv46jpki","cat":"meet","name":"Formula 1 Watch party","line":"Enjoy the race and pretend you are a better strategist that the existing ones!"},{"id":"i-mv46kxb9","cat":"explore","name":"Anderlecht Market Visit","line":"Shared visit of the big market in town - who will leave with the fullest bag?"}]}</script>

/* ---------- pan, zoom, fly ---------- */
var stage = $("stage"), world = $("world"), V = { x:0, y:0, k:1 }, KMAX = 2.6, raf = 0, flyMode = "ghent";
function size(){ return { w: stage.clientWidth, h: stage.clientHeight }; }
function kmin(){ return Math.max(size().h / IMG_H, .5); }
function clampAxis(p, view, span, m){
  var lo = view - span - m, hi = m;
  return lo > hi ? (view - span) / 2 : Math.min(hi, Math.max(lo, p));
}
var X0 = -640, X1 = IMG_W;                       /* map pixels you can pan across */
var padB = 150;                                   /* spare room below the map; grows while a card covers the bottom */
function clampY(y, d, pb){
  var lo = d.h - IMG_H * V.k - pb, hi = 150;
  return lo > hi ? (d.h - IMG_H * V.k) / 2 : Math.min(hi, Math.max(lo, y));
}
function apply(){
  var d = size();
  if(V.k < kmin()) V.k = kmin();
  var span = (X1 - X0) * V.k;
  var nx = clampAxis(V.x + X0 * V.k, d.w, span, 90) - X0 * V.k;
  V.x = nx; V.y = clampY(V.y, d, padB);
  world.setAttribute("transform", "translate(" + V.x.toFixed(2) + " " + V.y.toFixed(2) + ") scale(" + V.k.toFixed(4) + ")");
  var cx = (d.w / 2 - V.x) / V.k;
  var m = cx < -10 ? "brussels" : "ghent";
  if(m !== flyMode){ flyMode = m; $("flyTxt").textContent = m === "brussels" ? "Back to Brussels" : "Ghent day trip"; }
}
function zoomAt(px, py, nk){
  nk = Math.min(KMAX, Math.max(kmin(), nk));
  var wx = (px - V.x) / V.k, wy = (py - V.y) / V.k;
  V.k = nk; V.x = px - wx * nk; V.y = py - wy * nk; apply();
}
function cancelFly(){ if(raf){ cancelAnimationFrame(raf); raf = 0; } }
function flyTo(wx, wy, k, fy){
  var d = size(); k = Math.min(KMAX, Math.max(kmin(), k));
  var tx = d.w / 2 - wx * k, ty = (fy == null ? d.h / 2 : fy) - wy * k;
  cancelFly();
  if(reduce){ V.x = tx; V.y = ty; V.k = k; apply(); return; }
  var s0 = { x:V.x, y:V.y, k:V.k }, t0 = performance.now();
  var dur = Math.min(1500, 500 + Math.hypot(tx - s0.x, ty - s0.y) * 0.45);
  (function tick(now){
    var u = Math.min(1, (now - t0) / dur);
    u = u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2;
    V.x = s0.x + (tx - s0.x) * u; V.y = s0.y + (ty - s0.y) * u; V.k = s0.k + (k - s0.k) * u; apply();

  })(t0);

var ptrs = {}, nPtr = 0, moved = 0, didDrag = false, pinch = null;
function pList(){ var a = []; for(var k in ptrs) a.push(ptrs[k]); return a; }
stage.addEventListener("pointerdown", function(e){
  if(!ptrs[e.pointerId]) nPtr++;

  moved = 0; didDrag = false; if(!cur) settle(); else cancelFly(); hideHint();
  if(nPtr === 2){
    var a = pList();
    pinch = { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1, mx:(a[0].x + a[1].x) / 2, my:(a[0].y + a[1].y) / 2 };
  }
});
stage.addEventListener("pointermove", function(e){
  var p = ptrs[e.pointerId]; if(!p) return;
  if(nPtr === 1){
    var dx = e.clientX - p.x, dy = e.clientY - p.y; moved += Math.abs(dx) + Math.abs(dy);

    p.x = e.clientX; p.y = e.clientY; didDrag = true;
    var a = pList(), nd = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;

function getPath(o, p){ return p.split(".").reduce(function(a, k){ return a == null ? a : a[k]; }, o); }
function setPath(o, p, v){
  var ks = p.split("."), last = ks.pop();
  var t = ks.reduce(function(a, k){ return a[k]; }, o); t[last] = v;
}
function pid(p){ return "f-" + p.replace(/\./g, "-"); }
function field(label, p, o){
  o = o || {};
  var v = getPath(draft, p); if(Array.isArray(v)) v = v.join(", ");
  var tag = o.area
    ? '<textarea id="' + pid(p) + '" data-p="' + p + '"' + (o.kw ? ' data-t="kw"' : '') + '>' + esc(v) + '</textarea>'
    : '<input id="' + pid(p) + '" data-p="' + p + '"' + (o.kw ? ' data-t="kw"' : '') + ' type="' + (o.url ? "url" : "text") + '" value="' + esc(v) + '">';
  return '<label for="' + pid(p) + '">' + esc(label) + tag + '</label>';
}

/* The page rebuilds itself from its own style, script and data, so a saved edit is a full new version. */
var SKEL_OPEN = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
var SKEL_CLOSE = '</body></html>';
function buildDoc(data){
  var json = JSON.stringify(data).replace(/</g, "\\u003c");
  return SKEL_OPEN + "\n" + HEAD_FIXED
    + '<style id="pageStyle">' + $("pageStyle").textContent + '</style>\n<div id="mount"></div>\n'
    + '<script type="application/json" id="siteData">' + json + '<\/script>\n'
    + '<script id="pageScript">' + $("pageScript").textContent + '<\/script>\n' + SKEL_CLOSE;
}
function saveDraft(){
  if(saving) return;
  if(!artifactCap){ status("Saving is not available in this view. Open the link from your own Claude account."); return; }
  var out = JSON.parse(JSON.stringify(draft));
  out.ideas = out.ideas.filter(function(i){ return String(i.name || "").trim(); });
  out.vote.intro = out.vote.intro.filter(function(p){ return String(p).trim(); });
  out.vote.points = out.vote.points.filter(function(p){ return String(p.lead || "").trim() || String(p.text || "").trim(); });
  saving = true; $("edSave").disabled = true; status("Saving…");
  artifactCap.publish(buildDoc(out)).then(function(){
    status("Saved. The page is reloading with your changes.");
    setTimeout(function(){ saving = false; var b = $("edSave"); if(b) b.disabled = false; }, 3000);
  }).catch(function(err){
    saving = false; var s = $("edSave"); if(s) s.disabled = false;
    var c = err && err.code;
    if(c === "conflict") status("A newer version was published first. The page is reloading, please make your edit again.");
    else if(c === "not_writer" || c === "not_granted" || c === "consent_required" || c === "capability_disabled" || c === "not_declared") status("This view is read-only, so changes can't be saved here.");
    else if(c === "too_large") status("The page became too large to save. Shorten some text.");
    else if(c === "rate_limited") status("Too many saves in a row. Wait a minute and try again.");
    else status("Saving failed. Try again in a moment.");
  });
}
